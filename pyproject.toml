[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "moein-trading212-mcp"
version = "0.2.0"
description = "Local MCP access to your own Trading 212 Invest and Stocks ISA accounts"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Moein (moeinxyz)" }]
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1", "mcp>=1.27,<2", "pydantic>=2.11,<3"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Office/Business :: Financial",
]

[project.urls]
Source = "https://github.com/moeinxyz/trading212-mcp"
Issues = "https://github.com/moeinxyz/trading212-mcp/issues"

[project.scripts]
moein-trading212-mcp = "trading212_mcp.cli:main"
trading212-mcp = "trading212_mcp.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff==0.17.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
packages = ["trading212_mcp", "trading212_mcp.skills"]
package-dir = { trading212_mcp = "src", "trading212_mcp.skills" = "skills" }
include-package-data = false

[tool.setuptools.package-data]
"trading212_mcp.skills" = ["*/SKILL.md", "*/agents/openai.yaml"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["trading212_mcp"]

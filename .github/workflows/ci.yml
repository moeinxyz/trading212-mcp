name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

env:
  UV_VERSION: 0.13.9

jobs:
  test:
    name: Tests / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.15"]
        include:
          - os: ubuntu-latest
            python: "3.11"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python }}
          require-checksums: true
          enable-cache: false
      - run: uv sync --locked
      - run: uv run --no-sync python -m pytest -q

  package:
    name: Lint, format and installed wheel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.15"
          require-checksums: true
          enable-cache: false
      - run: uv sync --locked
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - name: Build the source distribution and its wheel
        run: uv build --out-dir "$RUNNER_TEMP/dist"
      - name: Verify the installed wheel and the on-demand uvx launch over stdio
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/wheel-env
        run: |
          uv sync --locked --no-dev --no-install-project
          python="$UV_PROJECT_ENVIRONMENT/bin/python"
          uv pip install --python "$python" --no-deps "$RUNNER_TEMP"/dist/*.whl
          cd "$RUNNER_TEMP"
          "$python" -I "$GITHUB_WORKSPACE/.github/scripts/smoke_wheel.py"
          "$python" -I "$GITHUB_WORKSPACE/.github/scripts/smoke_wheel.py" uvx --from "$RUNNER_TEMP"/dist/*.tar.gz trading212-mcp
